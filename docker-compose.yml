services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afrexlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-afrexlab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Data lives on the host, right next to the compose file — back up ./data
      # and you've backed up the whole platform (db + uploaded media on host ./data/media).
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrexlab}"]
      interval: 5s
      timeout: 5s
      retries: 5
