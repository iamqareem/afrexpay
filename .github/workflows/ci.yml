# CI — every push to main and every pull request.
# Tests are DB-free by design, so no Postgres service is needed.
# Intentionally thin: ALL logic lives in scripts/ci.sh (provider-agnostic).
# If GitHub ever gates compute, port the ~15 lines below to another
# runner (see docs/ci-porting.md) — nothing is re-implemented.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: ./scripts/ci.sh
