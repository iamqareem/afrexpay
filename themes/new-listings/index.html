<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Listings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="border-b border-surface2">
    <div class="max-w-5xl mx-auto px-5 py-5 flex items-center justify-between">
      <div class="font-display text-2xl">
        <span id="brand-name"></span>
        <span id="brand-accent" class="text-accent"></span>
      </div>
      <div id="theme-toggle-container"></div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 py-10">
    <div id="app-root"></div>
  </main>
  <footer style="text-align:center;padding:1.5rem 1rem;">
    <a href="/" aria-label="Visit store"><img src="/qr.svg" alt="Scan to visit this store" width="96" height="96" loading="lazy" style="display:block;margin:0 auto;" /></a>
    <p class="text-muted" style="font-size:0.75rem;margin-top:0.5rem;">Scan to visit</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
