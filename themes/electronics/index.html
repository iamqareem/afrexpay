<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Storefront</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-ink text-paper">

  <tech-app>
    <tech-header></tech-header>
    <tech-hero></tech-hero>
    
    <div class="max-w-6xl mx-auto px-5 py-14 flex flex-col md:flex-row gap-8">
      <tech-sidebar class="w-full md:w-64 flex-shrink-0"></tech-sidebar>
      <tech-grid class="flex-1"></tech-grid>
    </div>

    <footer class="max-w-6xl mx-auto px-5 py-10 border-t border-surface2 text-center mt-12">
      <p id="footer-text" class="font-mono text-xs text-muted"></p>
    </footer>

    <tech-quick-view></tech-quick-view>
    <tech-cart></tech-cart>
    <tech-checkout></tech-checkout>
  </tech-app>

  <script src="/js/app.js"></script>
</body>
</html>
